<!DOCTYPE html>

<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="icon.png" type="image/png">
<title>X</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #fff;
}

.logo {
    position: fixed;
    top: 20px;
    left: 20px;
    width: 400px;
    height: auto;
    z-index: 10;
}

.buttons {
    position: fixed;
    top: 50%;
    left: 20px;
    transform: translateY(-50%);
    display: flex;
    flex-direction: column;
    gap: 5px;
    z-index: 20;
}

.button {
    width: 250px;
    height: 80px;
    flex: 0 0 80px;
    padding: 0;
    margin: 0;
    border: none;
    outline: none;
    background: url("buttonTemplate.png") center / 100% 100% no-repeat;
    cursor: pointer;
    transition: transform 0.2s ease;

    display: flex;
    align-items: center;
    justify-content: center;

    color: #fff;
    font-family: "Press Start 2P", cursive;
    font-size: 18px;
}

.button:hover {
    transform: scale(1.15);
}

.copied-message {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: #000;
    font-family: "Press Start 2P", cursive;
    font-size: 24px;
    z-index: 30;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease;
    text-align: center;
}

.copied-message.show {
    opacity: 1;
}

.gubby-screen {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    object-fit: cover;
    display: none;
    z-index: 100;
}

.container {
    width: 100vw;
    height: 100vh;
    display: grid;
    grid-template-columns: repeat(18, 1fr);
    grid-template-rows: repeat(13, 1fr);
    gap: 4px;
    padding: 4px;
}

.container img {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: contain;
    min-width: 0;
    min-height: 0;
}
</style>

</head>

<body>

<img src="logo.png" class="logo" id="logo" alt="">

<div class="buttons">
    <button class="button" id="robloxButton" onclick="window.location.href='https://www.roblox.com/users/11248138932/profile'">
        ROBLOX
    </button>

```
<button class="button" id="discordButton" onclick="copyDiscord()">
    DISCORD
</button>

<button class="button" id="gubbyButton" onclick="showGubby()">
    GUBBY
</button>
```

</div>

<div class="copied-message" id="copiedMessage">
    Copied to clipboard
</div>

<img src="Gubby.png" class="gubby-screen" id="gubbyScreen" alt="">

<div class="container" id="container"></div>

<script>
const container = document.getElementById("container");
const logo = document.getElementById("logo");
const robloxButton = document.getElementById("robloxButton");
const discordButton = document.getElementById("discordButton");
const gubbyButton = document.getElementById("gubbyButton");
const copiedMessage = document.getElementById("copiedMessage");
const gubbyScreen = document.getElementById("gubbyScreen");

let imageIndex = 0;
let copiedTimeout;

function showCopied() {
    copiedMessage.classList.add("show");

    clearTimeout(copiedTimeout);

    copiedTimeout = setTimeout(() => {
        copiedMessage.classList.remove("show");
    }, 2000);
}

function copyDiscord() {
    navigator.clipboard.writeText("eviiish");
    showCopied();
}

function showGubby() {
    gubbyScreen.style.display = "block";
}

function changeImages() {
    const images = container.querySelectorAll("img");

    if (imageIndex === 0) {
        document.body.style.background = "#fff";

        images.forEach(img => {
            img.src = "𒐪.png";
        });

        logo.src = "logo.png";

        robloxButton.style.backgroundImage = 'url("buttonTemplate.png")';
        discordButton.style.backgroundImage = 'url("buttonTemplate.png")';
        gubbyButton.style.backgroundImage = 'url("buttonTemplate.png")';

        robloxButton.style.color = "#fff";
        discordButton.style.color = "#fff";
        gubbyButton.style.color = "#fff";
        copiedMessage.style.color = "#000";

        imageIndex = 1;
    } else {
        document.body.style.background = "#000";

        images.forEach(img => {
            img.src = "𒐪1.png";
        });

        logo.src = "logo1.png";

        robloxButton.style.backgroundImage = 'url("buttonTemplate1.png")';
        discordButton.style.backgroundImage = 'url("buttonTemplate1.png")';
        gubbyButton.style.backgroundImage = 'url("buttonTemplate1.png")';

        robloxButton.style.color = "#000";
        discordButton.style.color = "#000";
        gubbyButton.style.color = "#000";
        copiedMessage.style.color = "#fff";

        imageIndex = 0;
    }
}

for (let i = 0; i < 234; i++) {
    const img = document.createElement("img");
    img.src = "𒐪.png";
    img.alt = "";
    container.appendChild(img);
}

setInterval(changeImages, 1000);
</script>

</body>
</html>
